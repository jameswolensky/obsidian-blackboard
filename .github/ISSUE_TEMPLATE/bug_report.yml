name: Bug report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPad (Apple Pencil)
        - iPad (touch)
        - Android tablet
        - Desktop (Windows/macOS/Linux)
        - Other
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: "For example: 1.6.6"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Blackboard version
      placeholder: "For example: 1.3.2"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or notes
      description: Screenshots, screen recordings or any other context. Optional.
    validations:
      required: false
